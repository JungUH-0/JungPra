<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>자바스크립트 이벤트</title>
	<link rel="stylesheet" href="css/function.css">
</head>
<body>
	<!-- Do it! HTML 요소에 이벤트 처리기 연결하기 -->
	<ul>
		<li><a href="#" >Green</a></li>
		<!-- 문서 요소에 이벤트처리기 직접 붙이기 -->
		<li><a href="#" onclick = "msg()">Orange</a></li>
		<!-- <li><a href="#" onclick = "alert('Orange 클릭했습니다.')">Orange</a></li> -->
		<li><a href="#" onclick ="bgChange('purple')">Purple</a></li>
		<li id="red"><a href="#" >Red</a></li>
	</ul>		
	<div id="result"></div>
	<script>
		//이미지같은경우 onload 사용

		const liEl = document.querySelector('li');
		const divEl = document.querySelector('div')
		//첫번째 li 요소를 클릭했을 때 이벤트 핸들러 정의
		liEl.onclick = function(){
			divEl.style.backgroundColor='green'
			alert('Green 클릭했습니다.');
		}

		//id 가 result인 요서의 배경색을 color 로 바꾸는 함수
		const result= document.querySelector('#result');
		// console.log(result);
		function msg(){
			result.style.backgroundColor="orange"
			alert('Orange 클릭했습니다.');
		}

		//id가 red인 요소의 배경색을 빨간색으로 바꾸는 이벤트 핸들러 정의
		const redLi =  document.querySelector("#red");
		//redLi 요소에 클릭이벤트 발생시 이벤트 핸들러 호출 () 를 붙이지 않는다.
		redLi.onclick=redBg;
		function redBg(){
			result.style.backgroundColor='red';
		}

		function bgChange(color){
			result.style.backgroundColor=color;
		}
	</script>
</body>
</html>
