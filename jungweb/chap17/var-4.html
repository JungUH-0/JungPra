  <title>재선언과 재할당</title>
</head>
<body>
	<script>		
    // Do it! 변수의 재선언과 재할당
    function sum(){
      let n= 10;
      let result =0;
      for (let i=0; i<=n; i++){
        result += i;
      }
      console.log(result);
    }
    sum();
    // console.log(result);

  </script>
