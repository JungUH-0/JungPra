<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>세션 선택 - switch문</title>
	<link rel="stylesheet" href="css/switch.css">
</head>
<body>	
	<script>
		// Do it! switch문으로 조건 체크하기
		let  birth = prompt("생일인 달을 입력하세요.");
		switch (parseInt(birth)){
			case 3 :birth
			case 4 :birth
			case 5 :
				console.log("봄");
				break;
			case 6:birth
			case 7 :birth
			case 8 :
				console.log("여름");
				break;
			case 9 :birth
			case 10 :birth
			case 11:
				console.log("가을");
				break;
			case 12 :birth
			case 1 :birth
			case 3 :
				console.log("겨울");
				break;
		}

	</script>
</body>
</html>
