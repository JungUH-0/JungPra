<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
</head>
<body>
     <script>
          let stop = prompt("2~9단 사이 입력")
          console.log(stop)
          stop = parseInt(stop)
          for(let i=2; i<=9; i++){
               document.write(`<div class="timse">`);
               document.write(`<h3>${i}단</h3>`);
                    for(let j = 1; j<=9; j++){
                         document.write(`${i} X ${j} = ${i*j}<br>`);
                    }
                    document.write(`</div>`);
                    if(i===stop){
                         break;
                    }
          }
     </script>
</body>
</html>
