<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>1에서 1000까지 더하기</title>
	<style>
		body {
			font-size:1.5em;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
		}
	</style>
</head>
<body>
	<script>
		// Do it! for문을 사용해 1부터 1000까지 더하기
		const students = ['홍길동','김철수','이영희'];

		// for(let i = 0; i< students.length; i++){
		// 	console.log(students[i]);
		// }

		//forEach() 메서드 활용
		students.forEach(function(student,index){
			// console.log(student);
			console.log(`${index +1}. ${student}`);
		});
	</script>
</body>
</html>
