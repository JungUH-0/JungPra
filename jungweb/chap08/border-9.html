<!DOCTYPE html>
<html lang="ko">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
     <style>
          body{
               width: 1000px;
               margin: 100px ;
          }
          
     div {
      width:100px;
      height:100px;
      display:inline-block;
      margin:10px ;
      background:#ffd800;
      border:2px solid #222;
    }
    .box1{
     border-radius: 50% 50%;
    }
    .box2{
     border-radius: 0% 50%
    }
    .box3{
     border-radius: 10% 10%
    }
    .box4{
     border-radius: 30% 0%;
    }
     </style>

     
</head>
<body>
     <div class="box1"></div>
     <div class="box2"></div>
     <div class="box3"></div>
     <div class="box4"></div>
</body>
</html>
