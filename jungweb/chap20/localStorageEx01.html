<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로컬스토리지 입력 예제</title>
  <style>
    /* 1. 기본 배경 및 폰트 셋팅 */
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f5f6fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* 2. 콘텐츠를 감싸는 중앙 박스 */
    .container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    /* 3. 입력창 스타일 */
    #nameInput {
      padding: 10px 15px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
      width: 180px;
    }

    #nameInput:focus {
      border-color: #4a90e2; /* 포커스 시 파란색 테두리 */
    }

    /* 4. 버튼 공통 스타일 */
    button {
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 4px;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98); /* 클릭했을 때 살짝 눌리는 효과 */
    }

    /* 5. 버튼별 색상 분리 */
    #saveBtn {
      background-color: #4a90e2;
      color: white;
    }

    #saveBtn:hover {
      background-color: #357abd;
    }

    #loadBtn {
      background-color: #e2e8f0;
      color: #4a5568;
    }

    #loadBtn:hover {
      background-color: #cbd5e1;
    }

    #deleteBtn:hover {
      background-color: #c53030;
    }

    /* 6. 결과 메시지 스타일 */
    #result {
      margin-top: 20px;
      font-size: 15px;
      font-weight: 500;
      color: #333333;
      min-height: 22px; /* 텍스트가 없을 때도 공간 유지 */
    }
  </style>
</head>
<body>

  <div class="container">
    <input type="text" id="nameInput" placeholder="이름을 입력하세요" />
    <button id="saveBtn">저장</button>
    <button id="loadBtn">불러오기</button>
    <button id="deleteBtn">이름 삭제</button>
    
    <p id="result"></p>
  </div>

  <script>
    // 자바스크립트가 HTML 요소를 찾을 수 있도록 선언 추가
    const nameInput = document.getElementById("nameInput");
    const saveBtn = document.getElementById("saveBtn");
    const loadBtn = document.getElementById("loadBtn");
    const deleteBtn = document.getElementById("deleteBtn");
    const result = document.getElementById("result");

    // 저장 버튼 이벤트
    saveBtn.addEventListener("click", function () {
      const username = nameInput.value;
      
      if (!username) {
        result.textContent = "이름을 입력해 주세요.";
        result.style.color = "#e53e3e"; // 경고 시 빨간색 텍스트
        return;
      }

      localStorage.setItem("username", username);
      result.textContent = "🎉 이름이 저장되었습니다.";
      result.style.color = "#38a169"; // 성공 시 초록색 텍스트
    });

    // 불러오기 버튼 이벤트
    loadBtn.addEventListener("click", function () {
      const savedName = localStorage.getItem("username");

      if (savedName) {
        result.textContent = "🔍 저장된 이름: " + savedName;
        result.style.color = "#333333";
      } else {
        result.textContent = "저장된 데이터가 없습니다.";
        result.style.color = "#718096";
      }
    });

    //삭제 버튼 이벤트
    deleteBtn.addEventListener("click", function () {
      // 로컬스토리지에 데이터가 있는지 확인
      const hasData = localStorage.getItem("username");

      if (hasData) {
        // 로컬스토리지에서 'username' 키값 삭제
        localStorage.removeItem("username");
        
        // 입력창 비우기 및 안내 메시지 출력
        nameInput.value = "";
        result.textContent = "🗑️ 저장된 이름이 성공적으로 삭제되었습니다.";
        result.style.color = "#e53e3e";
      } else {
        result.textContent = "삭제할 데이터가 이미 없습니다.";
        result.style.color = "#718096";
      }
    });
  </script>
</body>
</html>
