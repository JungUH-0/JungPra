<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>라이트박스2</title>
    <link rel="stylesheet" href="css/lightbox.css">
  </head>
  <body>
    <div class="row">
      <ul>
        <li><img src="images/tree-1-thumb.jpg" data-src="images/tree-1.jpg" class="pic"></li>
        <li><img src="images/tree-2-thumb.jpg" data-src="images/tree-2.jpg" class="pic"></li>
        <li><img src="images/tree-3-thumb.jpg" data-src="images/tree-3.jpg" class="pic"></li> 
        <li><img src="images/tree-4-thumb.jpg" data-src="images/tree-4.jpg" class="pic"></li>
        <li><img src="images/tree-5-thumb.jpg" data-src="images/tree-5.jpg" class="pic"></li>
        <li><img src="images/tree-6-thumb.jpg" data-src="images/tree-6.jpg" class="pic"></li>          
      </ul>    
    </div>
    <div id="lightbox">
			<img src="images/tree-1.jpg" alt="" id="lightboxImage">			
    </div>

    <script>
      //원본 이미지 주소 나열 배열구조로 만들어서 해보기
      const originSrc = [
        'images/tree-1.jpg',
        'images/tree-2.jpg',
        'images/tree-3.jpg',
        'images/tree-4.jpg',
        'images/tree-5.jpg',
        'images/tree-6.jpg'
      ]
       //pic 클래스 요소 모두 가져오기
      const pics = document.querySelectorAll('.pic');
      
      //lightbox 요소 가져오기
      const lightbox = document.querySelector('#lightbox');

      //lightboxImage 요소 가져오기
      const lightboxImage = document.querySelector('#lightboxImage');

      pics.forEach(function(pic, index) {
        pic.addEventListener('click', function() {
      // 클릭된 이미지의 순서(index)에 맞는 원본 이미지 주소를 가져옴
          let bigLocation = originSrc[index];
          lightboxImage.src = bigLocation;
          lightbox.style.display = 'block';
        });
      });

  // 4. 라이트박스 클릭 시 닫기 
      lightbox.onclick = function() {
        lightbox.style.display = 'none';
  };


      //pic 모든 요소에 리스너 붙이기

      
      // pic 요소 click 이벤트 발생시 처리할 핸들러(함수) showLightBox() 선언
     /* function showLightBox(){
        //data-src 읽어서 bigLocaation에 저장


        //bigImg 값을 lightboxImage.src에 저장


        //lightbox 요소 보이기(lightbox.style.display = "block";)

      }*/

      //(요소에 익명함수 붙이기)lightbox 요소 클릭 이벤트 발생시 lightbox 요소 감추기(lightbox.style.display = "none";)

    </script>
  </body>
</html>
