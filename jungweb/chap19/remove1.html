<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul>
        <li id="bad-li">item-1</li>
        <li id="li2">item-2</li>
    </ul>

    <script>
        //<li> 요소 클릭하면 삭제 요소.remove() 더 간결해서 많이씀
        const badLi = document.querySelector('#bad-li');
        badLi.addEventListener('click',function(){
            badLi.remove();
        });

        //부모요소.removeChile(자식요소)
        const li2= document.querySelector('#li2');
        const ul = li2.parentNode;
        li2.addEventListener('click', function(){
            ul.removeChild(li2);
        });

    </script>
</body>
</html>
