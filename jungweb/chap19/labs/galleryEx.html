<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>DOM 추가 및 삭제 실습</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        .input-box { margin-bottom: 20px; }
        input { padding: 8px; font-size: 14px; }
        button { padding: 8px 15px; font-size: 14px; cursor: pointer; }
        
        /* [container] 카드들이 한 줄로 예쁘게 정렬되는 상자 */
        #container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 20px; 
            justify-content: center; 
            margin-top: 20px; 
        }
        
        /* [card] 개별 카드 스타일 */
        .card { 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            padding: 15px; 
            width: 150px; 
            box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover { transform: scale(1.05); border-color: red; } /* 마우스 올리면 삭제 안내 느낌 유도 */
        .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; }
        .card p { margin: 10px 0 0 0; font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <h1>🌿 나만의 미니 도감 🌿</h1>
    
    <div class="input-box">
        <input type="text" id="imgName" autofocus placeholder="예: tree-1, tree-2">
        <button id="addBtn">카드 추가</button>
    </div>

    <div id="container"></div>

    <script src="script.js"></script>
</body>
</html>
