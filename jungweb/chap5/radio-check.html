<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>레드향 주문하기</title>
</head>

<body>
  <h1>레드향 주문하기</h1>
  <form>
    <fieldset>
      <legend>상품 선택</legend>
      <!-- Do it! 라디오 버튼과 체크 박스를 사용한 폼 만들기 -->
      <p>주문할 상품을 선택해 주세요</p>
      <ul>
        <li><input type="checkbox" name="prod" id="p3"><label for="p3">선물용 3kg</label>
          <input type="number" min="0" max="5" size="5" />개(최대 : 5개)
        </li>
        <li><input type="checkbox" name="prod" id="p5"><label for="p5">선물용 5kg
            <input type="number" min="0" max="3" size="5" />개(최대 : 3개)
          </label></li>
        <li><input type="checkbox" name="prod" id="f3"><label for="f3">가정용 3kg</label>
          <input type="number" min="0" max="5" size="5" />개(최대 : 5개)
        </li>
        <li><input type="checkbox" name="prod" id="f5"><label for="f5">가정용 5kg</label>
          <input type="number" min="0" max="3" size="5" />개(최대 : 3개)
        </li>
      </ul>
      <p><b>포장 선택</b></p>
      <ul>
        <li><input type="radio" name="gift">선물포장
        </li>
        <li><input type="radio" name="gift">포장안함
        </li>
      </ul>

    </fieldset>
    <fieldset>
      <legend>배송 정보</legend>
      <ul>
        <li>
          <label for="user-name">이름 </label>
          <input type="text" id="user-name">
        </li>
        <li>
          <label for="addr">배송 주소</label>
          <input type="text" id="addr">
        </li>
        <li>
          <label for="mail">메일 주소</label>
          <input type="email" id="mail">
        </li>
        <li>
          <label for="phone">연락처</label>
          <input type="tel" id="phone">
        </li>
      </ul>
    </fieldset>
  </form>
</body>

</html>
