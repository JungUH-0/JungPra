<!DOCTYPE html>
<html lang="ko">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>개인 페이지</title>
     <link rel="stylesheet" href="css/form.css">
</head>
<body>
     <h1>나만의 서비스 신청서 설계하기</h1>
     <form>
          <fieldset>
               <legend>사용자 정보</legend>
               <p><small>(*) 필수 입력 항목</small></p>
               <ul>
                    <li><label for="user_name">이름(*)</label>
                         <input type="text" id="user_name" autofocus placeholder="이름을 입력하세요" required>
                    </li>
                    <li><label for="user_id">아이디(*)</label>
                         <input type="text" id="user_id" placeholder="10자이내" maxlength="10" required>
                    </li>
                    <li><label for="user_pw">비밀번호(*)</label>
                         <input type="password" id="user_pw" placeholder="4자~12자 이내 " minlength="4" maxlength="12" required>
                    </li>
                    <li><label for="pwchk">비밀번호 확인(*)</label>
                         <input type="password" id="pwchk" placeholder="비밀번호 확인" minlength="4" maxlength="12" required>
                    </li>
                    <li>
                         <label for="phone">연락처(*)</label>
                         <input type="tel" id="phone" placeholder="000-0000-0000" required>
                    </li>
                    <li><label for="birth">생년월일(*)</label>
                         <input type="date" id="birth" value="1990-01-01">
                    </li>
                    <li><label for="email">이메일</label>
                         <input type="text" id="email" style="width: 100px;">@
                         <select>
                              <option value="text">직접 입력</option>
                              <option value="naver.com">naver.com</option>
                              <option value="google.com">google.com</option>
                              <option value="daum.net">daum.net</option>
                         </select>
                    </li>
                    <li><label>성별</label>
                         <input type="radio" id="none"name="tjd" checked="checked"><label for="none"> 비밀</label>
                         <input type="radio" id="male" name="tjd"><label for="male">남자</label>
                         <input type="radio" id="female" name="tjd"><label for="female">여자</label>
                    </li>
                    <li>좋아하는 게임 종류
                         <input type="checkbox" name="game">RPG
                         <input type="checkbox" name="game">AOS
                         <input type="checkbox" name="game">로그라이크
                         <input type="checkbox" name="game">로그라이트
                         <input type="checkbox" name="game">수집형게임
                    </li>

               </ul>
          </fieldset>
          <label for="timenow">가입 시간</label>
          <input type="time" value="12:00" id="timenow">
          <div id="btn">
          <input type="submit" value="가입하기">
          <input type="reset" value="다시쓰기">
          </div>
     </form>
     
</body>
</html>
