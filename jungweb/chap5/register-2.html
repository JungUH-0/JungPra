<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>회원 가입</title>
  <style>
    #container {
      width: 600px;
      margin: 10px auto;
    }
  </style>
  <link rel="stylesheet" href="css/register.css">
</head>

<body>
  <div id="container">
    <h1>회원 가입을 환영합니다</h1>
    <form>
      <fieldset>
        <legend>사용자 정보</legend>
        <ul>
          <li>
            <label><b>아이디</b></label>
            <input type="text"
            placeholder="4자~10자 사이,공백없이"
            autofocus
            required
            id ="user_id" />
          </li>
          <li>
            <label><b>이메일</b></label>
            <input type="email"
            required
            id="user_mail">
          </li>
          <li><label><b>비밀번호</b></label></li>
          <input type="password" 
          required 
          placeholder="문자와 숫자,특수 기호 포함" 
          id="user_password"/>
          <li><label><b>비밀번호 확인</b></label></li>
          <input type="password" 
          required 
          id="user_pwchk"/>
          <li><label><b>가입 경로</b></label></li>
          <select id="sel">
            <optgroup label="온라인">
              <option value="blog">블로그</option>
              <option value="cafe">카페</option>
              <option value="youtube">유튜브</option>
            </optgroup>
            <optgroup label="오프라인">
              <option value="intro">지인 소개</option>
              <option value="add">광고</option>
              <option value="etc">기타</option>
            </optgroup>
          </select>
          <li><label><b>메모</b></label>
            <textarea id="txtarea" placeholder="남길 말씀이 있다면 여기에" cols="50" rows="10"></textarea>
          </li>
        </ul>
      </fieldset>
      <fieldset>
        <legend>이벤트와 새로운 소식</legend>
        <input type="radio" name="event" checked="checked" id="mailok">메일 수신
        <input type="radio" name="event" id="mailno">메일 수신 안 함

      </fieldset>

      <div id="buttons">
        <!-- 가입하기, 취소 버튼 작성 -->
         <input type="submit" value="가입하기"/>
         <input type="reset" value="취소"/>

      </div>
    </form>
  </div>
</body>

</html>
