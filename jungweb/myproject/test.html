<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>음악 추천 테스트 — Moodify</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- [chap04] <nav> 내비게이션 -->
  <nav>
    <a class="nav-logo" href="index.html">Mood<span>ify</span></a>
    <ul class="nav-links">
      <li><a href="index.html">홈</a></li>
      <li><a href="test.html" class="active">음악 추천 테스트</a></li>
      <li><a href="list.html">전체 탐색</a></li>
      <li><a href="playlist.html">내 플레이리스트</a></li>
      <li><a href="board.html">한줄 감상평</a></li>
    </ul>
    
  </nav>

  <main class="test-main">

    <!-- [chap08] position:sticky - 스크롤해도 상단 고정 -->
    <div class="progress-wrap">
      <!-- [chap19] DOM - JS에서 width 동적 변경 -->
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="test-container">

      <!-- ====== STEP 1: 장르 ====== -->
      <!-- [chap19] DOM - hidden 클래스로 단계 전환 -->
      <div class="step" id="step1">
        <div class="step-header">
          <span class="step-num">01 / 03</span>
          <h2>어떤 장르를 좋아하세요?</h2>
          <p>평소 즐겨 듣거나, 지금 끌리는 장르를 골라보세요.</p>
        </div>

        <!-- [chap12] Grid - 4열 선택지 배치 -->
        <div class="choice-grid">
          <!-- [chap05] <button> + data-* 속성 -->
          <!-- [chap19] DOM - dataset으로 값 읽기 -->
          <button class="choice-btn" data-value="lofi" data-step="genre">
            <span class="choice-emoji">🌙</span>
            <span class="choice-label">로파이</span>
            <span class="choice-desc">잔잔하고 아늑한</span>
          </button>
          <button class="choice-btn" data-value="pop" data-step="genre">
            <span class="choice-emoji">✨</span>
            <span class="choice-label">팝</span>
            <span class="choice-desc">밝고 경쾌한</span>
          </button>
          <button class="choice-btn" data-value="jazz" data-step="genre">
            <span class="choice-emoji">🎷</span>
            <span class="choice-label">재즈</span>
            <span class="choice-desc">감성적이고 세련된</span>
          </button>
          <button class="choice-btn" data-value="indie" data-step="genre">
            <span class="choice-emoji">🎸</span>
            <span class="choice-label">인디</span>
            <span class="choice-desc">독립적이고 개성있는</span>
          </button>
          <button class="choice-btn" data-value="rnb" data-step="genre">
            <span class="choice-emoji">🎤</span>
            <span class="choice-label">R&amp;B</span>
            <span class="choice-desc">부드럽고 리드미컬한</span>
          </button>
          <button class="choice-btn" data-value="hiphop" data-step="genre">
            <span class="choice-emoji">🎧</span>
            <span class="choice-label">힙합</span>
            <span class="choice-desc">강렬하고 에너지 넘치는</span>
          </button>
          <button class="choice-btn" data-value="classical" data-step="genre">
            <span class="choice-emoji">🎻</span>
            <span class="choice-label">클래식</span>
            <span class="choice-desc">우아하고 깊이있는</span>
          </button>
          <button class="choice-btn" data-value="electronic" data-step="genre">
            <span class="choice-emoji">🔊</span>
            <span class="choice-label">일렉트로닉</span>
            <span class="choice-desc">역동적이고 신나는</span>
          </button>
        </div>

        <!-- [chap11] Flexbox - 버튼 양쪽 정렬 -->
        <div class="step-nav">
          <span></span>
          <!-- [chap05] disabled 속성 - 선택 전 비활성화 -->
          <button class="btn-primary" id="next1" disabled onclick="nextStep(2)">다음 →</button>
        </div>
      </div>

      <!-- ====== STEP 2: 장소 ====== -->
      <div class="step hidden" id="step2">
        <div class="step-header">
          <span class="step-num">02 / 03</span>
          <h2>어디서 들을 예정이에요?</h2>
          <p>지금 있는 곳, 또는 음악을 들을 장소를 골라주세요.</p>
        </div>

        <div class="choice-grid">
          <button class="choice-btn" data-value="cafe" data-step="place">
            <span class="choice-emoji">☕</span>
            <span class="choice-label">카페</span>
            <span class="choice-desc">조용한 카페에서</span>
          </button>
          <button class="choice-btn" data-value="home" data-step="place">
            <span class="choice-emoji">🏠</span>
            <span class="choice-label">집</span>
            <span class="choice-desc">편안한 나만의 공간</span>
          </button>
          <button class="choice-btn" data-value="drive" data-step="place">
            <span class="choice-emoji">🚗</span>
            <span class="choice-label">드라이브</span>
            <span class="choice-desc">차 안에서 달리며</span>
          </button>
          <button class="choice-btn" data-value="gym" data-step="place">
            <span class="choice-emoji">🏋️</span>
            <span class="choice-label">헬스장</span>
            <span class="choice-desc">운동하면서</span>
          </button>
          <button class="choice-btn" data-value="study" data-step="place">
            <span class="choice-emoji">📚</span>
            <span class="choice-label">공부방/도서관</span>
            <span class="choice-desc">집중이 필요한 곳</span>
          </button>
          <button class="choice-btn" data-value="outdoor" data-step="place">
            <span class="choice-emoji">🌿</span>
            <span class="choice-label">야외</span>
            <span class="choice-desc">산책하거나 공원에서</span>
          </button>
        </div>

        <div class="step-nav">
          <button class="btn-outline" onclick="prevStep(1)">← 이전</button>
          <button class="btn-primary" id="next2" disabled onclick="nextStep(3)">다음 →</button>
        </div>
      </div>

      <!-- ====== STEP 3: 기분 ====== -->
      <div class="step hidden" id="step3">
        <div class="step-header">
          <span class="step-num">03 / 03</span>
          <h2>지금 기분이 어때요?</h2>
          <p>지금 이 순간의 감정이나 원하는 상태를 선택해주세요.</p>
        </div>

        <div class="choice-grid mood-grid">
          <button class="choice-btn mood-btn" data-value="focus" data-step="mood">
            <span class="choice-emoji">🎯</span>
            <span class="choice-label">집중하고 싶어</span>
            <span class="choice-desc">공부나 작업에 몰입</span>
          </button>
          <button class="choice-btn mood-btn" data-value="excited" data-step="mood">
            <span class="choice-emoji">🔥</span>
            <span class="choice-label">신나고 에너지 넘쳐</span>
            <span class="choice-desc">텐션을 올리고 싶은</span>
          </button>
          <button class="choice-btn mood-btn" data-value="healing" data-step="mood">
            <span class="choice-emoji">🌸</span>
            <span class="choice-label">쉬고 싶어, 힐링</span>
            <span class="choice-desc">마음을 편안하게</span>
          </button>
          <button class="choice-btn mood-btn" data-value="romantic" data-step="mood">
            <span class="choice-emoji">💜</span>
            <span class="choice-label">감성적이야</span>
            <span class="choice-desc">감정이 풍부한 순간</span>
          </button>
          <button class="choice-btn mood-btn" data-value="sad" data-step="mood">
            <span class="choice-emoji">🌧️</span>
            <span class="choice-label">우울하거나 쓸쓸해</span>
            <span class="choice-desc">감정을 위로받고 싶은</span>
          </button>
          <button class="choice-btn mood-btn" data-value="motivated" data-step="mood">
            <span class="choice-emoji">💪</span>
            <span class="choice-label">의욕이 넘쳐</span>
            <span class="choice-desc">뭔가 해내고 싶은</span>
          </button>
        </div>

        <div class="step-nav">
          <button class="btn-outline" onclick="prevStep(2)">← 이전</button>
          <!-- [chap17] onclick으로 goToResult() 호출 -->
          <button class="btn-primary" id="next3" disabled onclick="goToResult()">음악 추천받기 ✦</button>
        </div>
      </div>

      <!-- [chap08] position:fixed - 화면 하단 고정 요약 바 -->
      <!-- [chap20] LocalStorage - 선택 내용 실시간 표시 -->
      <div class="selection-summary" id="selectionSummary">
        <div class="summary-item">
          <span class="summary-icon">🎸</span>
          <span class="summary-text" id="text-genre">장르 미선택</span>
        </div>
        <div class="summary-arrow">›</div>
        <div class="summary-item">
          <span class="summary-icon">📍</span>
          <span class="summary-text" id="text-place">장소 미선택</span>
        </div>
        <div class="summary-arrow">›</div>
        <div class="summary-item">
          <span class="summary-icon">💭</span>
          <span class="summary-text" id="text-mood">기분 미선택</span>
        </div>
      </div>

    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/test.js"></script>
</body>

</html>
