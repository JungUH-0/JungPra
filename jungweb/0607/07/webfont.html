<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>웹 폰트 사용하기</title>
  <style>
    /* Do it! 구글 폰트 사용하기 */
    @import url('https://fonts.googleapis.com/css2?family=Atma:wght@300;400;500;600;700&display=swap');
    body {
      background:url('images/bg.jpg') no-repeat fixed;
      background-size:cover;
      text-align:center;
    }
    h1 {
      font-size:120px; 
      color: #fff;  
    }
    .html {
      font-family: "Nanum Pen Script", cursive;
    }
    .atma-light {
  font-family: "Atma", system-ui;
  font-weight: 300;
  font-style: normal;
}

.atma-regular {
  font-family: "Atma", system-ui;
  font-weight: 400;
  font-style: normal;
}

.atma-medium {
  font-family: "Atma", system-ui;
  font-weight: 500;
  font-style: normal;
}

.atma-semibold {
  font-family: "Atma", system-ui;
  font-weight: 600;
  font-style: normal;
}

#atma-bold {
  font-family: "Atma", system-ui;
  font-weight: 700;
  font-style: normal;
}

  </style>

</head>
<body>
  <h1 id="atma-bold" >HTML<span style="color:red">asd</span></h1>
  <h1 class="atma-light" >CSS</h1>
  <h1 class="atma-regular">자바스크립트</h1>
</body>
</html>
