<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>letter-spacing</title>
    <style>  
      p {
        font-size:33px;
      }
      /* Do it! 글자 간격 조절하기 */
      .spacing1{
        letter-spacing: 0.2em;
      }
      .spacing2{
        letter-spacing: 0.5em;
      }

     
    </style>
  </head>
  <body>
    <p >CSS : Cascading Style Sheet</p> 
    <p style="word-spacing: 0.5em; letter-spacing: 0.2em;">CSS : Cascading Style Sheet</p> <!--단어 사이의 간격  -->
    <p class="spacing1">CSS : Cascading Style Sheet</p> <!--문자 사이의 간격-->
    <p class="spacing2">CSS : Cascading Style Sheet</p>
  </body>
</html>
